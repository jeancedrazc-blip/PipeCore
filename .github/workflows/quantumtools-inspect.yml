name: Inspect Quantum Tools Source

on:
  push:
    branches: [ 'agent/rftoolsbuilder-port-26.1.2' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct current Quantum source
        shell: bash
        run: |
          base64 -d rftoolsbuilder-port261-src.b64 > rftoolsbuilder-port261-src.tar.xz
          tar -xJf rftoolsbuilder-port261-src.tar.xz
          python3 - <<'PYFIX'
          from pathlib import Path
          p=Path('RFToolsBuilderPort261/src/main/java/mcjty/rftoolsbuilder/client/BuilderScreen.java')
          s=p.read_text()
          s=s.replace('import net.minecraft.client.gui.GuiGraphicsExtractor;\n', 'import net.minecraft.client.Minecraft;\nimport net.minecraft.client.gui.GuiGraphicsExtractor;\n')
          s=s.replace('import net.minecraft.client.gui.screens.Screen;\n', '')
          s=s.replace('        super(menu, inventory, title);\n        this.imageWidth = 176;\n        this.imageHeight = 218;\n', '        super(menu, inventory, title, 176, 218);\n')
          s=s.replace('        boolean fast = Screen.hasShiftDown();', '        boolean fast = Minecraft.getInstance().hasShiftDown();')
          s=s.replace('    protected void extractBackground(GuiGraphicsExtractor graphics, int mouseX, int mouseY, float partialTick) {', '    public void extractBackground(GuiGraphicsExtractor graphics, int mouseX, int mouseY, float partialTick) {')
          p.write_text(s)
          p=Path('RFToolsBuilderPort261/src/main/java/mcjty/rftoolsbuilder/RFToolsBuilder.java')
          p.write_text(p.read_text().replace('Capabilities.EnergyStorage.BLOCK', 'Capabilities.Energy.BLOCK'))
          PYFIX
          python3 rftoolsbuilder-ui-v2.py
          python3 rftoolsbuilder-energy-fix.py
          python3 quantum-filter-core.py
          python3 quantum-filter-client.py
          python3 quantum-api-fix.py
          python3 quantumtools-assets.py
          python3 quantum-ui-polish.py
          python3 quantumtools-3.0.1-fix.py
          python3 quantumtools-3.0.2-fix.py
          echo '=== BUILDER BE ==='
          sed -n '1,760p' RFToolsBuilderPort261/src/main/java/mcjty/rftoolsbuilder/BuilderBlockEntity.java
          echo '=== BUILDER MENU ==='
          sed -n '1,360p' RFToolsBuilderPort261/src/main/java/mcjty/rftoolsbuilder/BuilderMenu.java
          echo '=== BUILDER SCREEN ==='
          sed -n '1,520p' RFToolsBuilderPort261/src/main/java/mcjty/rftoolsbuilder/client/BuilderScreen.java
          echo '=== FILTER SCREEN ==='
          sed -n '1,520p' RFToolsBuilderPort261/src/main/java/mcjty/rftoolsbuilder/client/QuarryFilterScreen.java
          echo '=== SHAPE CARD ==='
          sed -n '1,300p' RFToolsBuilderPort261/src/main/java/mcjty/rftoolsbuilder/ShapeCardItem.java
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Create Minecraft artifacts
        working-directory: RFToolsBuilderPort261
        run: gradle createMinecraftArtifacts --no-daemon
      - name: Probe chunk/render APIs
        shell: bash
        run: |
          JAR=''
          while IFS= read -r f; do
            if jar tf "$f" 2>/dev/null | grep -q '^net/minecraft/server/level/ServerLevel.class$'; then JAR="$f"; break; fi
          done < <(find RFToolsBuilderPort261/build ~/.gradle/caches -type f -name '*.jar' 2>/dev/null)
          echo "MINECRAFT_JAR=$JAR"
          test -n "$JAR"
          echo '=== ServerLevel chunk methods ==='
          javap -classpath "$JAR" net.minecraft.server.level.ServerLevel | grep -E 'getChunk|addRegionTicket|removeRegionTicket|setChunkForced|ChunkPos' || true
          echo '=== ServerChunkCache ==='
          javap -classpath "$JAR" net.minecraft.server.level.ServerChunkCache | grep -E 'addRegionTicket|removeRegionTicket|getChunk|updateChunkForced' || true
          echo '=== TicketType ==='
          javap -classpath "$JAR" net.minecraft.server.level.TicketType | head -120 || true
          echo '=== LevelChunk ==='
          javap -classpath "$JAR" net.minecraft.world.level.chunk.LevelChunk | head -80 || true
