name: Inspect Quantum Tools Source

on:
  push:
    branches: [ 'agent/rftoolsbuilder-port-26.1.2' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and patch
        shell: bash
        run: |
          base64 -d rftoolsbuilder-port261-src.b64 > rftoolsbuilder-port261-src.tar.xz
          tar -xJf rftoolsbuilder-port261-src.tar.xz
          python3 - <<'PYFIX'
          from pathlib import Path
          p=Path('RFToolsBuilderPort261/src/main/java/mcjty/rftoolsbuilder/client/BuilderScreen.java')
          s=p.read_text()
          s=s.replace('import net.minecraft.client.gui.GuiGraphicsExtractor;\n', 'import net.minecraft.client.Minecraft;\nimport net.minecraft.client.gui.GuiGraphicsExtractor;\n')
          s=s.replace('import net.minecraft.client.gui.screens.Screen;\n', '')
          s=s.replace('        super(menu, inventory, title);\n        this.imageWidth = 176;\n        this.imageHeight = 218;\n', '        super(menu, inventory, title, 176, 218);\n')
          s=s.replace('        boolean fast = Screen.hasShiftDown();', '        boolean fast = Minecraft.getInstance().hasShiftDown();')
          s=s.replace('    protected void extractBackground(GuiGraphicsExtractor graphics, int mouseX, int mouseY, float partialTick) {', '    public void extractBackground(GuiGraphicsExtractor graphics, int mouseX, int mouseY, float partialTick) {')
          p.write_text(s)
          p=Path('RFToolsBuilderPort261/src/main/java/mcjty/rftoolsbuilder/RFToolsBuilder.java')
          p.write_text(p.read_text().replace('Capabilities.EnergyStorage.BLOCK', 'Capabilities.Energy.BLOCK'))
          PYFIX
          python3 rftoolsbuilder-ui-v2.py
          python3 rftoolsbuilder-energy-fix.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Create Minecraft artifacts
        working-directory: RFToolsBuilderPort261
        run: gradle createMinecraftArtifacts --no-daemon
      - name: Probe exact APIs
        shell: bash
        run: |
          JAR=''
          while IFS= read -r f; do
            if jar tf "$f" 2>/dev/null | grep -q '^net/minecraft/world/item/ItemStack.class$'; then JAR="$f"; break; fi
          done < <(find RFToolsBuilderPort261/build ~/.gradle/caches -type f -name '*.jar' 2>/dev/null)
          echo "MINECRAFT_JAR=$JAR"
          test -n "$JAR"
          echo '=== ItemStack ==='
          javap -classpath "$JAR" net.minecraft.world.item.ItemStack | grep -E 'CODEC|MAP_CODEC|typeHolder|getItemHolder|getComponents|Damage|same|matches|ItemStack\(' || true
          echo '=== AbstractContainerMenu ==='
          javap -classpath "$JAR" net.minecraft.world.inventory.AbstractContainerMenu | grep -E 'clicked|quickMove|ContainerInput|ClickType' || true
          echo '=== ContainerInput ==='
          javap -classpath "$JAR" net.minecraft.world.inventory.ContainerInput || true
          echo '=== ClickType ==='
          javap -classpath "$JAR" net.minecraft.world.inventory.ClickType || true
          echo '=== TagValueOutput ==='
          javap -classpath "$JAR" net.minecraft.world.level.storage.TagValueOutput | head -120 || true
          echo '=== TagValueInput ==='
          javap -classpath "$JAR" net.minecraft.world.level.storage.TagValueInput | head -120 || true
          echo '=== Holder Item tags / BuiltInRegistries ==='
          javap -classpath "$JAR" net.minecraft.core.Holder | grep -E 'tags|is\(' || true
          javap -classpath "$JAR" net.minecraft.core.registries.BuiltInRegistries | head -40 || true
