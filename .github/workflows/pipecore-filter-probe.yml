name: Pipe Core Filter Probe

on:
  push:
    branches: [ 'agent/pipecore-filter-rework' ]
    paths:
      - '.github/workflows/pipecore-filter-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          parts = sorted(Path('build-src').glob('part_*.b64'))
          data = b''.join(p.read_bytes() for p in parts)
          Path('pipecore-src.tar.xz').write_bytes(base64.b64decode(data, validate=False))
          PY
          tar -xJf pipecore-src.tar.xz
      - name: Apply V17 stack
        shell: bash
        run: |
          base64 -d ci/v7_patch.py.gz.b64 | gzip -dc > /tmp/v7_patch.py
          python3 /tmp/v7_patch.py PipeCore-v7-buildsrc
          python3 ci/v8_hotfix.py PipeCore-v7-buildsrc
          python3 ci/v9_hotfix.py PipeCore-v7-buildsrc
          python3 ci/v10_hotfix.py PipeCore-v7-buildsrc
          python3 ci/v11_hotfix.py PipeCore-v7-buildsrc
          python3 ci/v12_hotfix.py PipeCore-v7-buildsrc
          python3 ci/v13_hotfix.py PipeCore-v7-buildsrc
          python3 ci/v14_hotfix.py PipeCore-v7-buildsrc
          cat ci/v16/part_*.b64 | base64 -d | gzip -dc > /tmp/v16_hotfix.py
          python3 /tmp/v16_hotfix.py PipeCore-v7-buildsrc
          python3 ci/v17_hotfix.py PipeCore-v7-buildsrc
      - name: Package generated filter sources
        shell: bash
        run: |
          tar -czf pipecore-v17-generated.tar.gz \
            PipeCore-v7-buildsrc/gradle.properties \
            PipeCore-v7-buildsrc/src/main/java/com/pipecore/block/PipeBlockEntity.java \
            PipeCore-v7-buildsrc/src/main/java/com/pipecore/menu/PipeMenu.java \
            PipeCore-v7-buildsrc/src/main/java/com/pipecore/client/PipeScreen.java \
            PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/lang/pt_br.json \
            PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/lang/en_us.json
      - uses: actions/upload-artifact@v4
        with:
          name: pipecore-v17-generated
          path: pipecore-v17-generated.tar.gz
