name: Build Pipe Core

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'
      - 'build-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          cat build-src/part_*.b64 | base64 -d > pipecore-src.tar.xz
          tar -xJf pipecore-src.tar.xz
          test -f PipeCore-v7-buildsrc/build.gradle

      - name: Patch source for Minecraft 26.1.2 API
        shell: bash
        run: |
          sed -i 's/player\.displayClientMessage(/player.sendSystemMessage(/g' PipeCore-v7-buildsrc/src/main/java/com/pipecore/block/PipeBlock.java

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build Pipe Core
        working-directory: PipeCore-v7-buildsrc
        run: gradle clean build --no-daemon --stacktrace

      - name: Stage test JAR
        shell: bash
        run: |
          cp PipeCore-v7-buildsrc/build/libs/pipecore-1.3.0.jar PipeCore-1.3.0-NeoForge-26.1.2.jar
          test -s PipeCore-1.3.0-NeoForge-26.1.2.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: PipeCore-1.3.0-NeoForge-26.1.2
          path: PipeCore-1.3.0-NeoForge-26.1.2.jar

      - name: Publish test JAR to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f PipeCore-1.3.0-NeoForge-26.1.2.jar
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build Pipe Core 1.3.0"
          git push
