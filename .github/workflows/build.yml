name: Build Cage Trap

on:
  push:
    branches: [ 'agent/cagetrap-v1' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Cage Trap source
        shell: bash
        run: |
          base64 -d cagetrap-src-v4.b64 > cagetrap-src-v4.tar.xz
          echo '42c266d8f164f8ce3ddcadd0edda535dfe159ca0373589a9f7b0d4e85dbb35a9  cagetrap-src-v4.tar.xz' | sha256sum -c -
          xz -t cagetrap-src-v4.tar.xz
          tar -xJf cagetrap-src-v4.tar.xz
          test -f CageTrapProjectV4/build.gradle

      - name: Apply 1.1.4 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, base64
          root = Path('CageTrapProjectV4')
          java = root/'src/main/java/com/jeancedraz/cagetrap'
          res = root/'src/main/resources'

          p = root/'build.gradle'
          s = p.read_text()
          s2, n = re.subn(r"(?m)^version\s*=\s*['\"]1\.1\.0['\"]", "version = '1.1.4'", s, count=1)
          assert n == 1, 'version line not found'
          p.write_text(s2)

          # Keep the easier metal-block mining behavior.
          p = java/'CageTrap.java'
          s = p.read_text()
          s2, n = re.subn(r'\.strength\(3\.5F,\s*1200(?:\.0)?F\)', '.strength(2.0F, 1200.0F)', s, count=1)
          assert n == 1, 'strength call not found'
          p.write_text(s2)

          tag = res/'data/minecraft/tags/block/mineable/pickaxe.json'
          tag.parent.mkdir(parents=True, exist_ok=True)
          tag.write_text(json.dumps({'replace': False, 'values': ['cagetrap:cage_trap']}, indent=2) + '\n')

          # Inventory item is always a closed cage. Filled item has a distinct orange indicator.
          (res/'assets/cagetrap/models/item/cage_trap.json').write_text(json.dumps({'parent': 'cagetrap:block/cage_trap_closed'}, indent=2) + '\n')
          (res/'assets/cagetrap/models/item/cage_trap_filled.json').write_text(json.dumps({
              'parent': 'cagetrap:block/cage_trap_closed',
              'textures': {'side': 'cagetrap:block/cage_trap_filled'}
          }, indent=2) + '\n')
          filled_png = ''
          tex = res/'assets/cagetrap/textures/block/cage_trap_filled.png'
          tex.parent.mkdir(parents=True, exist_ok=True)
          tex.write_bytes(base64.b64decode(filled_png))

          p = java/'CageTrapBlockEntity.java'
          s = p.read_text()

          # One placed trap gets exactly one capture/release cycle. After a successful
          # release it remains visually open but permanently disarmed until the block
          # is broken and placed again (new BE => disarmed=false).
          anchor = '    private transient Entity displayEntity;'
          assert anchor in s, 'displayEntity field not found'
          s = s.replace(anchor, anchor + '\n    private boolean disarmed = false;', 1)

          capture_sig = '    public boolean capture(Mob mob) {'
          assert capture_sig in s, 'capture method not found'
          s = s.replace(capture_sig, capture_sig + '\n        if (disarmed) {\n            return false;\n        }', 1)

          start = s.index('    public boolean release() {')
          end = s.index('    public Entity getDisplayEntity()', start)
          r = s[start:end]

          # Spawn the released mob away from the trap as a second safeguard.
          r = r.replace('worldPosition.above(),', 'worldPosition.above(2),', 1)
          r = r.replace('worldPosition.north()', 'worldPosition.north(2)')
          r = r.replace('worldPosition.south()', 'worldPosition.south(2)')
          r = r.replace('worldPosition.east()', 'worldPosition.east(2)')
          r = r.replace('worldPosition.west()', 'worldPosition.west(2)')

          # Mark the placed trap spent only if addFreshEntity actually succeeds.
          pat = re.compile(r'(?m)^(\s*)if \([^\n]*\.addFreshEntity\([^\n]*\)\) \{')
          m = pat.search(r)
          assert m is not None, 'addFreshEntity conditional not found'
          insertion = m.group(0) + '\n' + m.group(1) + '    disarmed = true;'
          r = r[:m.start()] + insertion + r[m.end():]
          s = s[:start] + r + s[end:]

          # Persist the spent/disarmed state through chunk/world reloads.
          save_anchor = '        super.saveAdditional(output);'
          assert save_anchor in s, 'saveAdditional anchor not found'
          s = s.replace(save_anchor, save_anchor + '\n        output.putBoolean("Disarmed", disarmed);', 1)

          load_anchor = '        super.loadAdditional(input);'
          assert load_anchor in s, 'loadAdditional anchor not found'
          s = s.replace(load_anchor, load_anchor + '\n        disarmed = input.getBooleanOr("Disarmed", false);', 1)

          p.write_text(s)

          sigfile = res/'META-INF/JEAN_CEDRAZ.SIGNATURE'
          sigfile.write_text(sigfile.read_text().replace('Build line: 1.1.0', 'Build line: 1.1.4'))
          print('1.1.4 persistent-disarm fixes applied')
          PY

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Validate resources and patch
        working-directory: CageTrapProjectV4
        run: |
          python3 - <<'PY'
          import json, pathlib, struct
          root=pathlib.Path('src/main/resources')
          for p in root.rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          for p in root.rglob('*.png'):
              b=p.read_bytes(); assert b[:8] == b'\x89PNG\r\n\x1a\n', p
              w,h=struct.unpack('>II', b[16:24]); assert (w,h)==(16,16), (p,w,h)
          assert json.loads((root/'assets/cagetrap/models/item/cage_trap.json').read_text())['parent']=='cagetrap:block/cage_trap_closed'
          assert json.loads((root/'assets/cagetrap/models/item/cage_trap_filled.json').read_text())['parent']=='cagetrap:block/cage_trap_closed'
          assert 'cagetrap:cage_trap' in json.loads((root/'data/minecraft/tags/block/mineable/pickaxe.json').read_text())['values']
          src=pathlib.Path('src/main/java/com/jeancedraz/cagetrap/CageTrapBlockEntity.java').read_text()
          assert 'private boolean disarmed = false;' in src
          assert 'if (disarmed)' in src
          assert 'output.putBoolean("Disarmed", disarmed);' in src
          assert 'input.getBooleanOr("Disarmed", false)' in src
          assert 'captureBlockedUntil' not in src
          print('Resources and persistent-disarm patch OK')
          PY

      - name: Compile and build
        working-directory: CageTrapProjectV4
        run: gradle clean build --no-daemon --stacktrace

      - name: Server smoke test
        working-directory: CageTrapProjectV4
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout 90s gradle runServer --no-daemon --stacktrace > server-smoke.log 2>&1
          code=$?
          set -e
          cat server-smoke.log
          if grep -Eqi 'ModLoadingException|Failed to load mod|Exception in thread "main"|Crash report' server-smoke.log; then exit 1; fi
          if ! grep -Eq 'Done \(' server-smoke.log; then echo "Server did not reach ready state (exit code: $code)"; exit 1; fi

      - name: Stage and inspect JAR
        shell: bash
        run: |
          cp CageTrapProjectV4/build/libs/cagetrap-1.1.4.jar CageTrap-1.1.4-NeoForge-26.1.2.jar
          test -s CageTrap-1.1.4-NeoForge-26.1.2.jar
          unzip -t CageTrap-1.1.4-NeoForge-26.1.2.jar
          jar tf CageTrap-1.1.4-NeoForge-26.1.2.jar | grep -q 'com/jeancedraz/cagetrap/CageTrapBlockEntity.class'
          jar tf CageTrap-1.1.4-NeoForge-26.1.2.jar | grep -q 'assets/cagetrap/textures/block/cage_trap_filled.png'
          jar tf CageTrap-1.1.4-NeoForge-26.1.2.jar | grep -q 'data/minecraft/tags/block/mineable/pickaxe.json'
          sha256sum CageTrap-1.1.4-NeoForge-26.1.2.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: CageTrap-1.1.4-NeoForge-26.1.2
          path: CageTrap-1.1.4-NeoForge-26.1.2.jar
