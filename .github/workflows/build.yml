name: Build Pipe Core

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'
      - 'build-trigger.txt'
      - 'ci/v9_hotfix.py'
      - 'ci/v10_hotfix.py'
      - 'ci/v11_hotfix.py'
      - 'ci/v12_hotfix.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          parts = sorted(Path('build-src').glob('part_*.b64'))
          if not parts:
              raise SystemExit('No source chunks found')
          data = b''.join(p.read_bytes() for p in parts)
          decoded = base64.b64decode(data, validate=False)
          Path('pipecore-src.tar.xz').write_bytes(decoded)
          print(f'Reconstructed {len(decoded)} bytes from {len(parts)} chunks')
          PY
          echo 'e8ada27e80120f37cf6f55fcd42115d6fb9870ad7817f08eca5964f56528a32c  pipecore-src.tar.xz' | sha256sum -c -
          xz -t pipecore-src.tar.xz
          tar -xJf pipecore-src.tar.xz
          test -f PipeCore-v7-buildsrc/build.gradle

      - name: Apply Pipe Core fixes
        shell: bash
        run: |
          base64 -d ci/v7_patch.py.gz.b64 | gzip -dc > /tmp/v7_patch.py
          python3 /tmp/v7_patch.py PipeCore-v7-buildsrc
          python3 ci/v8_hotfix.py PipeCore-v7-buildsrc
          python3 ci/v9_hotfix.py PipeCore-v7-buildsrc
          python3 ci/v10_hotfix.py PipeCore-v7-buildsrc
          python3 ci/v11_hotfix.py PipeCore-v7-buildsrc
          python3 ci/v12_hotfix.py PipeCore-v7-buildsrc
          sed -i 's/@Nullable ModelFeatureRenderer\.CrumblingOverlay/ModelFeatureRenderer.CrumblingOverlay/' PipeCore-v7-buildsrc/src/main/java/com/pipecore/client/render/PipeBlockEntityRenderer.java

          grep -q '^mod_version=1.3.9$' PipeCore-v7-buildsrc/gradle.properties
          grep -q 'CONFIGURATOR.get() && player.isShiftKeyDown()' PipeCore-v7-buildsrc/src/main/java/com/pipecore/block/PipeBlock.java
          grep -q 'EnergyHandlerUtil.move' PipeCore-v7-buildsrc/src/main/java/com/pipecore/block/PipeBlockEntity.java
          grep -q 'energyHandler(level, sourcePos' PipeCore-v7-buildsrc/src/main/java/com/pipecore/block/PipeBlockEntity.java
          grep -q 'ChemicalTransportRegistry.canConnect' PipeCore-v7-buildsrc/src/main/java/com/pipecore/block/PipeBlockEntity.java
          if grep -q 'case CHEMICAL -> !level.getBlockState(neighborPos).isAir()' PipeCore-v7-buildsrc/src/main/java/com/pipecore/block/PipeBlockEntity.java; then
            echo 'Chemical pipe still connects to arbitrary terrain'
            exit 1
          fi

          grep -q '"center": "pipecore:block/item_pipe"' PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/models/block/item_pipe_center.json
          grep -q '"side": "pipecore:block/item_pipe_vertical"' PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/models/block/item_pipe_arm.json
          grep -q '"cap": "pipecore:block/item_pipe"' PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/models/block/item_pipe_arm.json
          grep -q '"center": "pipecore:block/energy_pipe"' PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/models/block/energy_pipe_center.json
          grep -q '"side": "pipecore:block/energy_pipe_vertical"' PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/models/block/energy_pipe_arm.json
          grep -q '"texture": "#center"' PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/models/block/pipe_center_base.json
          grep -q '"texture": "#cap"' PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/models/block/pipe_arm_base.json
          grep -q '"texture": "#side"' PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/models/block/pipe_arm_base.json

          grep -q 'pipecore:basic_upgrade_card' PipeCore-v7-buildsrc/src/main/resources/data/pipecore/recipe/improved_upgrade_card.json
          grep -q 'pipecore:improved_upgrade_card' PipeCore-v7-buildsrc/src/main/resources/data/pipecore/recipe/advanced_upgrade_card.json
          grep -q 'pipecore:advanced_upgrade_card' PipeCore-v7-buildsrc/src/main/resources/data/pipecore/recipe/ultimate_upgrade_card.json

          python3 - <<'PY'
          from pathlib import Path
          import struct
          base = Path('PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/textures/item')
          names = [
              'basic_upgrade_card.png',
              'improved_upgrade_card.png',
              'advanced_upgrade_card.png',
              'ultimate_upgrade_card.png',
              'filter_card.png',
              'void_filter_card.png',
          ]
          for name in names:
              p = base / name
              data = p.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{name} is not PNG')
              w, h = struct.unpack('>II', data[16:24])
              if (w, h) != (16, 16):
                  raise SystemExit(f'{name} is {w}x{h}, expected 16x16')
              print(name, len(data), 'bytes', w, h)
          PY

          test -s PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/textures/block/item_pipe.png
          test -s PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/textures/block/item_pipe_vertical.png
          test -s PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/textures/block/fluid_pipe.png
          test -s PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/textures/block/fluid_pipe_vertical.png
          test -s PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/textures/block/energy_pipe.png
          test -s PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/textures/block/energy_pipe_vertical.png
          test -s PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/textures/block/chemical_pipe.png
          test -s PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/textures/block/chemical_pipe_vertical.png
          test -s PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/textures/item/configurator.png

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build Pipe Core
        working-directory: PipeCore-v7-buildsrc
        run: gradle clean build --no-daemon --stacktrace

      - name: Stage V12 JAR
        shell: bash
        run: |
          cp PipeCore-v7-buildsrc/build/libs/pipecore-1.3.9.jar PipeCore-1.3.9-NeoForge-26.1.2.jar
          test -s PipeCore-1.3.9-NeoForge-26.1.2.jar
          jar tf PipeCore-1.3.9-NeoForge-26.1.2.jar | grep -q 'com/pipecore/block/PipeBlock.class'
          jar tf PipeCore-1.3.9-NeoForge-26.1.2.jar | grep -q 'com/pipecore/block/PipeBlockEntity.class'
          jar tf PipeCore-1.3.9-NeoForge-26.1.2.jar | grep -q 'com/pipecore/api/ChemicalTransportRegistry.class'
          jar tf PipeCore-1.3.9-NeoForge-26.1.2.jar | grep -q 'assets/pipecore/models/block/pipe_center_base.json'
          jar tf PipeCore-1.3.9-NeoForge-26.1.2.jar | grep -q 'assets/pipecore/textures/block/energy_pipe_vertical.png'
          jar tf PipeCore-1.3.9-NeoForge-26.1.2.jar | grep -q 'assets/pipecore/textures/item/basic_upgrade_card.png'
          jar tf PipeCore-1.3.9-NeoForge-26.1.2.jar | grep -q 'assets/pipecore/textures/item/improved_upgrade_card.png'
          jar tf PipeCore-1.3.9-NeoForge-26.1.2.jar | grep -q 'assets/pipecore/textures/item/advanced_upgrade_card.png'
          jar tf PipeCore-1.3.9-NeoForge-26.1.2.jar | grep -q 'assets/pipecore/textures/item/ultimate_upgrade_card.png'
          jar tf PipeCore-1.3.9-NeoForge-26.1.2.jar | grep -q 'assets/pipecore/textures/item/filter_card.png'
          jar tf PipeCore-1.3.9-NeoForge-26.1.2.jar | grep -q 'assets/pipecore/textures/item/void_filter_card.png'
          jar tf PipeCore-1.3.9-NeoForge-26.1.2.jar | grep -q 'assets/pipecore/textures/item/configurator.png'
          sha256sum PipeCore-1.3.9-NeoForge-26.1.2.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: PipeCore-1.3.9-NeoForge-26.1.2
          path: PipeCore-1.3.9-NeoForge-26.1.2.jar

      - name: Publish V12 JAR to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f PipeCore-1.3.9-NeoForge-26.1.2.jar
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build Pipe Core 1.3.9 V12"
          git push
