name: Build PipeCore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Rebuild source archive
        shell: bash
        run: |
          cat ci/source.bin.* > /tmp/PipeCore-26.1.2-v6-source.zip
          echo 'f070afbbf4c1733394d7dfb732b69b2ec1e953fe797604a6988c409351e28ec6  /tmp/PipeCore-26.1.2-v6-source.zip' | sha256sum -c -
          mkdir -p work
          unzip -q /tmp/PipeCore-26.1.2-v6-source.zip -d work

      - name: Build PipeCore
        working-directory: work/PipeCore-26.1.2-v6
        run: gradle clean build --stacktrace --no-daemon

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PipeCore-jar
          path: work/PipeCore-26.1.2-v6/build/libs/*.jar
          if-no-files-found: error
