name: Build Pipe Core

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'
      - 'build-trigger.txt'
      - 'ci/v9_hotfix.py'
      - 'ci/v10_hotfix.py'
      - 'ci/v11_hotfix.py'
      - 'ci/v12_hotfix.py'
      - 'ci/v13_hotfix.py'
      - 'ci/v14_hotfix.py'
      - 'ci/v16_hotfix.py.gz.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          parts = sorted(Path('build-src').glob('part_*.b64'))
          if not parts:
              raise SystemExit('No source chunks found')
          data = b''.join(p.read_bytes() for p in parts)
          decoded = base64.b64decode(data, validate=False)
          Path('pipecore-src.tar.xz').write_bytes(decoded)
          print(f'Reconstructed {len(decoded)} bytes from {len(parts)} chunks')
          PY
          echo 'e8ada27e80120f37cf6f55fcd42115d6fb9870ad7817f08eca5964f56528a32c  pipecore-src.tar.xz' | sha256sum -c -
          xz -t pipecore-src.tar.xz
          tar -xJf pipecore-src.tar.xz
          test -f PipeCore-v7-buildsrc/build.gradle

      - name: Apply Pipe Core fixes
        shell: bash
        run: |
          base64 -d ci/v7_patch.py.gz.b64 | gzip -dc > /tmp/v7_patch.py
          python3 /tmp/v7_patch.py PipeCore-v7-buildsrc
          python3 ci/v8_hotfix.py PipeCore-v7-buildsrc
          python3 ci/v9_hotfix.py PipeCore-v7-buildsrc
          python3 ci/v10_hotfix.py PipeCore-v7-buildsrc
          python3 ci/v11_hotfix.py PipeCore-v7-buildsrc
          python3 ci/v12_hotfix.py PipeCore-v7-buildsrc
          python3 ci/v13_hotfix.py PipeCore-v7-buildsrc
          python3 ci/v14_hotfix.py PipeCore-v7-buildsrc
          base64 -d ci/v16_hotfix.py.gz.b64 | gzip -dc > /tmp/v16_hotfix.py
          python3 /tmp/v16_hotfix.py PipeCore-v7-buildsrc
          sed -i 's/@Nullable ModelFeatureRenderer\.CrumblingOverlay/ModelFeatureRenderer.CrumblingOverlay/' PipeCore-v7-buildsrc/src/main/java/com/pipecore/client/render/PipeBlockEntityRenderer.java

          grep -q '^mod_version=1.3.13$' PipeCore-v7-buildsrc/gradle.properties
          grep -q 'NeoForge.EVENT_BUS.register(new PipeInteractionEvents())' PipeCore-v7-buildsrc/src/main/java/com/pipecore/PipeCore.java
          test ! -f PipeCore-v7-buildsrc/src/main/java/com/pipecore/item/ConfiguratorItem.java
          grep -q 'registerCapabilities' PipeCore-v7-buildsrc/src/main/java/com/pipecore/PipeCore.java
          grep -q 'Capabilities.Energy.BLOCK' PipeCore-v7-buildsrc/src/main/java/com/pipecore/PipeCore.java
          grep -q 'class NetworkEnergyHandler' PipeCore-v7-buildsrc/src/main/java/com/pipecore/block/PipeBlockEntity.java
          grep -q 'energyCapability' PipeCore-v7-buildsrc/src/main/java/com/pipecore/block/PipeBlockEntity.java
          grep -q 'BUTTON_DISTRIBUTION' PipeCore-v7-buildsrc/src/main/java/com/pipecore/menu/PipeMenu.java
          grep -q 'FILTER_SLOT_COUNT' PipeCore-v7-buildsrc/src/main/java/com/pipecore/menu/PipeMenu.java
          grep -q 'filterBlacklist' PipeCore-v7-buildsrc/src/main/java/com/pipecore/block/PipeBlockEntity.java
          grep -q 'ROUND_ROBIN' PipeCore-v7-buildsrc/src/main/java/com/pipecore/block/PipeBlockEntity.java
          grep -q 'ui.pipecore.filter_whitelist' PipeCore-v7-buildsrc/src/main/java/com/pipecore/client/PipeScreen.java

          test -s PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/models/block/pipe_straight_ns_base.json
          test -s PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/models/block/pipe_straight_vertical_base.json
          grep -q '"render_type": "minecraft:cutout"' PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/models/block/pipe_straight_ns_base.json
          grep -q '"render_type": "minecraft:cutout"' PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/models/block/pipe_arm_base.json

          python3 - <<'PY'
          from pathlib import Path
          import json, struct
          root = Path('PipeCore-v7-buildsrc/src/main/resources')
          for p in (root / 'assets/pipecore/blockstates').glob('*_pipe.json'):
              json.loads(p.read_text())
          for p in (root / 'assets/pipecore/models/block').glob('*.json'):
              json.loads(p.read_text())
          cfg = root / 'assets/pipecore/textures/item/configurator.png'
          data = cfg.read_bytes()
          if data[:8] != b'\x89PNG\r\n\x1a\n' or struct.unpack('>II', data[16:24]) != (16, 16):
              raise SystemExit('configurator.png invalid')
          PY

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build Pipe Core
        working-directory: PipeCore-v7-buildsrc
        run: gradle clean build --no-daemon --stacktrace

      - name: Stage V16 JAR
        shell: bash
        run: |
          cp PipeCore-v7-buildsrc/build/libs/pipecore-1.3.13.jar PipeCore-1.3.13-NeoForge-26.1.2.jar
          test -s PipeCore-1.3.13-NeoForge-26.1.2.jar
          jar tf PipeCore-1.3.13-NeoForge-26.1.2.jar | grep -q 'com/pipecore/block/PipeBlock.class'
          jar tf PipeCore-1.3.13-NeoForge-26.1.2.jar | grep -q 'com/pipecore/block/PipeBlockEntity.class'
          jar tf PipeCore-1.3.13-NeoForge-26.1.2.jar | grep -q 'com/pipecore/menu/PipeMenu.class'
          jar tf PipeCore-1.3.13-NeoForge-26.1.2.jar | grep -q 'com/pipecore/client/PipeScreen.class'
          jar tf PipeCore-1.3.13-NeoForge-26.1.2.jar | grep -q 'assets/pipecore/textures/block/energy_pipe_vertical.png'
          jar tf PipeCore-1.3.13-NeoForge-26.1.2.jar | grep -q 'assets/pipecore/textures/item/configurator.png'
          sha256sum PipeCore-1.3.13-NeoForge-26.1.2.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: PipeCore-1.3.13-NeoForge-26.1.2
          path: PipeCore-1.3.13-NeoForge-26.1.2.jar

      - name: Publish V16 JAR to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f PipeCore-1.3.13-NeoForge-26.1.2.jar
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build Pipe Core 1.3.13 V16"
          git push
