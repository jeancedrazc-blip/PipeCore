name: Build Cage Trap

on:
  push:
    branches: [ 'agent/cagetrap-v1' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Cage Trap 1.1.0 source
        shell: bash
        run: |
          base64 -d cagetrap-src-v4.b64 > cagetrap-src-v4.tar.xz
          echo '42c266d8f164f8ce3ddcadd0edda535dfe159ca0373589a9f7b0d4e85dbb35a9  cagetrap-src-v4.tar.xz' | sha256sum -c -
          xz -t cagetrap-src-v4.tar.xz
          tar -xJf cagetrap-src-v4.tar.xz
          test -f CageTrapProjectV4/build.gradle
          test -f CageTrapProjectV4/src/main/resources/META-INF/JEAN_CEDRAZ.SIGNATURE

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Validate resources
        working-directory: CageTrapProjectV4
        run: |
          python3 - <<'PY'
          import json, pathlib, struct
          root=pathlib.Path('src/main/resources')
          for p in root.rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          for p in root.rglob('*.png'):
              b=p.read_bytes()
              assert b[:8] == b'\x89PNG\r\n\x1a\n', p
              w,h=struct.unpack('>II', b[16:24])
              assert (w,h)==(16,16), (p,w,h)
          assert (root/'META-INF/JEAN_CEDRAZ.SIGNATURE').is_file()
          blockstate=json.loads((root/'assets/cagetrap/blockstates/cage_trap.json').read_text())
          assert 'open=true' in blockstate['variants'] and 'open=false' in blockstate['variants']
          recipe=json.loads((root/'data/cagetrap/recipe/cage_trap.json').read_text())
          assert recipe['pattern']==['NBN','BRB','NBN']
          assert recipe['key']['N']=='minecraft:iron_nugget'
          assert recipe['key']['B']=='minecraft:iron_bars'
          assert recipe['key']['R']=='minecraft:redstone'
          print('Resources OK')
          PY

      - name: Compile and build
        working-directory: CageTrapProjectV4
        run: gradle clean build --no-daemon --stacktrace

      - name: Server smoke test
        working-directory: CageTrapProjectV4
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout 90s gradle runServer --no-daemon --stacktrace > server-smoke.log 2>&1
          code=$?
          set -e
          cat server-smoke.log
          if grep -Eqi 'ModLoadingException|Failed to load mod|Exception in thread "main"|Crash report' server-smoke.log; then
            exit 1
          fi
          if ! grep -Eq 'Done \(' server-smoke.log; then
            echo "Server did not reach ready state (exit code: $code)"
            exit 1
          fi

      - name: Stage and inspect JAR
        shell: bash
        run: |
          cp CageTrapProjectV4/build/libs/cagetrap-1.1.0.jar CageTrap-1.1.0-NeoForge-26.1.2.jar
          test -s CageTrap-1.1.0-NeoForge-26.1.2.jar
          unzip -t CageTrap-1.1.0-NeoForge-26.1.2.jar
          jar tf CageTrap-1.1.0-NeoForge-26.1.2.jar | grep -q 'com/jeancedraz/cagetrap/CageTrap.class'
          jar tf CageTrap-1.1.0-NeoForge-26.1.2.jar | grep -q 'com/jeancedraz/cagetrap/CageTrapBlock.class'
          jar tf CageTrap-1.1.0-NeoForge-26.1.2.jar | grep -q 'com/jeancedraz/cagetrap/CageTrapBlockEntity.class'
          jar tf CageTrap-1.1.0-NeoForge-26.1.2.jar | grep -q 'com/jeancedraz/cagetrap/CageTrapItem.class'
          jar tf CageTrap-1.1.0-NeoForge-26.1.2.jar | grep -q 'com/jeancedraz/cagetrap/client/CageTrapBlockEntityRenderer.class'
          jar tf CageTrap-1.1.0-NeoForge-26.1.2.jar | grep -q 'META-INF/JEAN_CEDRAZ.SIGNATURE'
          jar tf CageTrap-1.1.0-NeoForge-26.1.2.jar | grep -q 'assets/cagetrap/models/block/cage_trap_open.json'
          jar tf CageTrap-1.1.0-NeoForge-26.1.2.jar | grep -q 'assets/cagetrap/models/block/cage_trap_closed.json'
          jar tf CageTrap-1.1.0-NeoForge-26.1.2.jar | grep -q 'assets/cagetrap/items/cage_trap_filled.json'
          if jar tf CageTrap-1.1.0-NeoForge-26.1.2.jar | grep -Eq 'untamedwilds|com/pipecore'; then
            echo 'Unexpected reference implementation classes found in final JAR'
            exit 1
          fi
          sha256sum CageTrap-1.1.0-NeoForge-26.1.2.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: CageTrap-1.1.0-NeoForge-26.1.2
          path: CageTrap-1.1.0-NeoForge-26.1.2.jar
