name: Build PipeCore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Rebuild source archive
        shell: bash
        run: |
          cat \
            ci/source.bin.00 ci/source.bin.01 ci/source.bin.02 ci/source.bin.03 ci/source.bin.04 ci/source.bin.05 ci/source.bin.06 \
            ci/source.fix.07 \
            ci/source.bin.08 ci/source.bin.09 ci/source.bin.10 ci/source.bin.11 ci/source.bin.12 ci/source.bin.13 ci/source.bin.14 ci/source.bin.15 ci/source.bin.16 ci/source.bin.17 ci/source.bin.18 ci/source.bin.19 \
            ci/source.fix.20 \
            ci/source.bin.21 ci/source.bin.22 ci/source.bin.23 ci/source.bin.24 ci/source.bin.25 ci/source.bin.26 ci/source.bin.27 ci/source.bin.28 ci/source.bin.29 ci/source.bin.30 \
            > /tmp/PipeCore-26.1.2-v6-source.zip
          sha256sum /tmp/PipeCore-26.1.2-v6-source.zip
          unzip -t /tmp/PipeCore-26.1.2-v6-source.zip
          mkdir -p work
          unzip -q /tmp/PipeCore-26.1.2-v6-source.zip -d work

      - name: Build PipeCore
        working-directory: work/PipeCore-26.1.2-v6
        run: gradle clean build --stacktrace --no-daemon

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PipeCore-jar
          path: work/PipeCore-26.1.2-v6/build/libs/*.jar
          if-no-files-found: error
