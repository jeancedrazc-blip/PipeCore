name: Build Cage Trap

on:
  push:
    branches: [ 'agent/cagetrap-v1' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Cage Trap source
        shell: bash
        run: |
          base64 -d cagetrap-src-v4.b64 > cagetrap-src-v4.tar.xz
          echo '42c266d8f164f8ce3ddcadd0edda535dfe159ca0373589a9f7b0d4e85dbb35a9  cagetrap-src-v4.tar.xz' | sha256sum -c -
          xz -t cagetrap-src-v4.tar.xz
          tar -xJf cagetrap-src-v4.tar.xz
          test -f CageTrapProjectV4/build.gradle

      - name: Apply 1.1.3 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, base64
          root = Path('CageTrapProjectV4')
          java = root/'src/main/java/com/jeancedraz/cagetrap'
          res = root/'src/main/resources'

          p = root/'build.gradle'
          s = p.read_text()
          s2, n = re.subn(r"(?m)^version\s*=\s*['\"]1\.1\.0['\"]", "version = '1.1.3'", s, count=1)
          assert n == 1, 'version line not found'
          p.write_text(s2)

          p = java/'CageTrap.java'
          s = p.read_text()
          s2, n = re.subn(r'\.strength\(3\.5F,\s*1200(?:\.0)?F\)', '.strength(2.0F, 1200.0F)', s, count=1)
          assert n == 1, 'strength call not found'
          p.write_text(s2)

          tag = res/'data/minecraft/tags/block/mineable/pickaxe.json'
          tag.parent.mkdir(parents=True, exist_ok=True)
          tag.write_text(json.dumps({'replace': False, 'values': ['cagetrap:cage_trap']}, indent=2) + '\n')

          # Inventory item is always a closed cage. The filled state gets a distinct orange energy core.
          (res/'assets/cagetrap/models/item/cage_trap.json').write_text(json.dumps({'parent': 'cagetrap:block/cage_trap_closed'}, indent=2) + '\n')
          (res/'assets/cagetrap/models/item/cage_trap_filled.json').write_text(json.dumps({
              'parent': 'cagetrap:block/cage_trap_closed',
              'textures': {'side': 'cagetrap:block/cage_trap_filled'}
          }, indent=2) + '\n')
          filled_png = ''
          tex = res/'assets/cagetrap/textures/block/cage_trap_filled.png'
          tex.parent.mkdir(parents=True, exist_ok=True)
          tex.write_bytes(base64.b64decode(filled_png))

          p = java/'CageTrapBlockEntity.java'
          s = p.read_text()
          anchor = '    private transient Entity displayEntity;'
          assert anchor in s, 'displayEntity field not found'
          s = s.replace(anchor, anchor + '\n    private long captureBlockedUntil = 0L;', 1)

          sig = '    public boolean capture(Mob mob) {'
          assert sig in s, 'capture method not found'
          s = s.replace(sig, sig + '\n        if (level != null && level.getGameTime() < captureBlockedUntil) {\n            return false;\n        }', 1)

          start = s.index('    public boolean release() {')
          end = s.index('    public Entity getDisplayEntity()', start)
          r = s[start:end]
          r = r.replace('worldPosition.above(),', 'worldPosition.above(2),', 1)
          r = r.replace('worldPosition.north()', 'worldPosition.north(2)')
          r = r.replace('worldPosition.south()', 'worldPosition.south(2)')
          r = r.replace('worldPosition.east()', 'worldPosition.east(2)')
          r = r.replace('worldPosition.west()', 'worldPosition.west(2)')
          pat = re.compile(r'(?m)^(\s*)if \([^\n]*\.addFreshEntity\([^\n]*\)\) \{')
          m = pat.search(r)
          assert m is not None, 'addFreshEntity conditional not found'
          indent = m.group(1)
          r = r[:m.start()] + indent + 'captureBlockedUntil = level.getGameTime() + 40L;\n' + r[m.start():]
          s = s[:start] + r + s[end:]
          p.write_text(s)

          sigfile = res/'META-INF/JEAN_CEDRAZ.SIGNATURE'
          sigfile.write_text(sigfile.read_text().replace('Build line: 1.1.0', 'Build line: 1.1.3'))
          print('1.1.3 fixes applied')
          PY

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Validate resources
        working-directory: CageTrapProjectV4
        run: |
          python3 - <<'PY'
          import json, pathlib, struct
          root=pathlib.Path('src/main/resources')
          for p in root.rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          for p in root.rglob('*.png'):
              b=p.read_bytes()
              assert b[:8] == b'\x89PNG\r\n\x1a\n', p
              w,h=struct.unpack('>II', b[16:24])
              assert (w,h)==(16,16), (p,w,h)
          empty=json.loads((root/'assets/cagetrap/models/item/cage_trap.json').read_text())
          filled=json.loads((root/'assets/cagetrap/models/item/cage_trap_filled.json').read_text())
          assert empty['parent']=='cagetrap:block/cage_trap_closed'
          assert filled['parent']=='cagetrap:block/cage_trap_closed'
          assert filled['textures']['side']=='cagetrap:block/cage_trap_filled'
          assert (root/'assets/cagetrap/textures/block/cage_trap_filled.png').is_file()
          assert 'cagetrap:cage_trap' in json.loads((root/'data/minecraft/tags/block/mineable/pickaxe.json').read_text())['values']
          print('Resources OK')
          PY

      - name: Compile and build
        working-directory: CageTrapProjectV4
        run: gradle clean build --no-daemon --stacktrace

      - name: Server smoke test
        working-directory: CageTrapProjectV4
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout 90s gradle runServer --no-daemon --stacktrace > server-smoke.log 2>&1
          code=$?
          set -e
          cat server-smoke.log
          if grep -Eqi 'ModLoadingException|Failed to load mod|Exception in thread "main"|Crash report' server-smoke.log; then exit 1; fi
          if ! grep -Eq 'Done \(' server-smoke.log; then echo "Server did not reach ready state (exit code: $code)"; exit 1; fi

      - name: Stage and inspect JAR
        shell: bash
        run: |
          cp CageTrapProjectV4/build/libs/cagetrap-1.1.3.jar CageTrap-1.1.3-NeoForge-26.1.2.jar
          test -s CageTrap-1.1.3-NeoForge-26.1.2.jar
          unzip -t CageTrap-1.1.3-NeoForge-26.1.2.jar
          jar tf CageTrap-1.1.3-NeoForge-26.1.2.jar | grep -q 'com/jeancedraz/cagetrap/CageTrapBlockEntity.class'
          jar tf CageTrap-1.1.3-NeoForge-26.1.2.jar | grep -q 'assets/cagetrap/textures/block/cage_trap_filled.png'
          jar tf CageTrap-1.1.3-NeoForge-26.1.2.jar | grep -q 'data/minecraft/tags/block/mineable/pickaxe.json'
          unzip -p CageTrap-1.1.3-NeoForge-26.1.2.jar assets/cagetrap/models/item/cage_trap.json | grep -q 'cage_trap_closed'
          unzip -p CageTrap-1.1.3-NeoForge-26.1.2.jar assets/cagetrap/models/item/cage_trap_filled.json | grep -q 'cage_trap_filled'
          sha256sum CageTrap-1.1.3-NeoForge-26.1.2.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: CageTrap-1.1.3-NeoForge-26.1.2
          path: CageTrap-1.1.3-NeoForge-26.1.2.jar
