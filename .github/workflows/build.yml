name: Build Pipe Core

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'
      - 'build-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          parts = sorted(Path('build-src').glob('part_*.b64'))
          if not parts:
              raise SystemExit('No source chunks found')
          data = b''.join(p.read_bytes() for p in parts)
          decoded = base64.b64decode(data, validate=False)
          Path('pipecore-src.tar.xz').write_bytes(decoded)
          print(f'Reconstructed {len(decoded)} bytes from {len(parts)} chunks')
          PY
          echo 'e8ada27e80120f37cf6f55fcd42115d6fb9870ad7817f08eca5964f56528a32c  pipecore-src.tar.xz' | sha256sum -c -
          xz -t pipecore-src.tar.xz
          tar -xJf pipecore-src.tar.xz
          test -f PipeCore-v7-buildsrc/build.gradle

      - name: Apply Pipe Core V7 fixes
        shell: bash
        run: |
          base64 -d ci/v7_patch.py.gz.b64 | gzip -dc > /tmp/v7_patch.py
          python3 /tmp/v7_patch.py PipeCore-v7-buildsrc
          sed -i 's/@Nullable ModelFeatureRenderer\.CrumblingOverlay/ModelFeatureRenderer.CrumblingOverlay/' PipeCore-v7-buildsrc/src/main/java/com/pipecore/client/render/PipeBlockEntityRenderer.java
          grep -q '^mod_version=1.3.4$' PipeCore-v7-buildsrc/gradle.properties
          grep -q 'pipecore:basic_upgrade_card' PipeCore-v7-buildsrc/src/main/resources/data/pipecore/recipe/improved_upgrade_card.json
          grep -q 'pipecore:improved_upgrade_card' PipeCore-v7-buildsrc/src/main/resources/data/pipecore/recipe/advanced_upgrade_card.json
          grep -q 'pipecore:advanced_upgrade_card' PipeCore-v7-buildsrc/src/main/resources/data/pipecore/recipe/ultimate_upgrade_card.json
          test -f PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/models/block/item_pipe_arm_up.json
          test -s PipeCore-v7-buildsrc/src/main/resources/assets/pipecore/textures/item/configurator.png

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build Pipe Core
        working-directory: PipeCore-v7-buildsrc
        run: gradle clean build --no-daemon --stacktrace

      - name: Stage V7 JAR
        shell: bash
        run: |
          cp PipeCore-v7-buildsrc/build/libs/pipecore-1.3.4.jar PipeCore-1.3.4-NeoForge-26.1.2.jar
          test -s PipeCore-1.3.4-NeoForge-26.1.2.jar
          jar tf PipeCore-1.3.4-NeoForge-26.1.2.jar | grep -q 'data/pipecore/recipe/improved_upgrade_card.json'
          jar tf PipeCore-1.3.4-NeoForge-26.1.2.jar | grep -q 'assets/pipecore/textures/item/configurator.png'
          jar tf PipeCore-1.3.4-NeoForge-26.1.2.jar | grep -q 'assets/pipecore/models/block/item_pipe_arm_up.json'
          sha256sum PipeCore-1.3.4-NeoForge-26.1.2.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: PipeCore-1.3.4-NeoForge-26.1.2
          path: PipeCore-1.3.4-NeoForge-26.1.2.jar

      - name: Publish V7 JAR to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f PipeCore-1.3.4-NeoForge-26.1.2.jar
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build Pipe Core 1.3.4 V7"
          git push
