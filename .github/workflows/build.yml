name: Build Cage Trap

on:
  push:
    branches: [ 'agent/cagetrap-v1' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Cage Trap source
        shell: bash
        run: |
          base64 -d cagetrap-src-v2.b64 > cagetrap-src.tar.xz
          echo '1e6d7a9b5cf5b3c003b503de2caa8240286bca1561474d7780c6c525dc38572b  cagetrap-src.tar.xz' | sha256sum -c -
          xz -t cagetrap-src.tar.xz
          tar -xJf cagetrap-src.tar.xz
          test -f CageTrapProject/build.gradle
          test -f CageTrapProject/src/main/resources/META-INF/JEAN_CEDRAZ.SIGNATURE

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Validate resources
        working-directory: CageTrapProject
        run: |
          python3 - <<'PY'
          import json, pathlib, struct
          root=pathlib.Path('src/main/resources')
          for p in root.rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          for p in root.rglob('*.png'):
              b=p.read_bytes()
              assert b[:8] == b'\x89PNG\r\n\x1a\n', p
              w,h=struct.unpack('>II', b[16:24])
              assert (w,h)==(16,16), (p,w,h)
          assert (root/'META-INF/JEAN_CEDRAZ.SIGNATURE').is_file()
          print('Resources OK')
          PY

      - name: Compile and build
        working-directory: CageTrapProject
        run: gradle clean build --no-daemon --stacktrace

      - name: Server smoke test
        working-directory: CageTrapProject
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout 90s gradle runServer --no-daemon --stacktrace > server-smoke.log 2>&1
          code=$?
          set -e
          cat server-smoke.log
          if grep -Eqi 'ModLoadingException|Failed to load mod|Exception in thread "main"|Crash report' server-smoke.log; then
            exit 1
          fi
          if ! grep -Eq 'Done \(' server-smoke.log; then
            echo "Server did not reach ready state (exit code: $code)"
            exit 1
          fi

      - name: Stage and inspect JAR
        shell: bash
        run: |
          cp CageTrapProject/build/libs/cagetrap-1.0.0.jar CageTrap-1.0.0-NeoForge-26.1.2.jar
          test -s CageTrap-1.0.0-NeoForge-26.1.2.jar
          unzip -t CageTrap-1.0.0-NeoForge-26.1.2.jar
          jar tf CageTrap-1.0.0-NeoForge-26.1.2.jar | grep -q 'com/jeancedraz/cagetrap/CageTrap.class'
          jar tf CageTrap-1.0.0-NeoForge-26.1.2.jar | grep -q 'com/jeancedraz/cagetrap/CageTrapBlock.class'
          jar tf CageTrap-1.0.0-NeoForge-26.1.2.jar | grep -q 'com/jeancedraz/cagetrap/CageTrapBlockEntity.class'
          jar tf CageTrap-1.0.0-NeoForge-26.1.2.jar | grep -q 'com/jeancedraz/cagetrap/client/CageTrapBlockEntityRenderer.class'
          jar tf CageTrap-1.0.0-NeoForge-26.1.2.jar | grep -q 'META-INF/JEAN_CEDRAZ.SIGNATURE'
          jar tf CageTrap-1.0.0-NeoForge-26.1.2.jar | grep -q 'assets/cagetrap/textures/block/cage_trap.png'
          if jar tf CageTrap-1.0.0-NeoForge-26.1.2.jar | grep -Eq 'untamedwilds|com/pipecore'; then
            echo 'Unexpected reference implementation classes found in final JAR'
            exit 1
          fi
          sha256sum CageTrap-1.0.0-NeoForge-26.1.2.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: CageTrap-1.0.0-NeoForge-26.1.2
          path: CageTrap-1.0.0-NeoForge-26.1.2.jar
