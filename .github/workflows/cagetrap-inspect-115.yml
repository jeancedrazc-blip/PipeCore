name: Inspect Cage Trap Current
on:
  push:
    branches: [ 'agent/cagetrap-v1' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct current source
        shell: bash
        run: |
          base64 -d cagetrap-src-v4.b64 > cagetrap-src-v4.tar.xz
          tar -xJf cagetrap-src-v4.tar.xz
          python3 cagetrap-basepatch.py
          python3 cagetrap-115.py
          python3 cagetrap-116.py
          echo '=== ITEM ==='
          sed -n '1,420p' CageTrapProjectV4/src/main/java/com/jeancedraz/cagetrap/CageTrapItem.java
          echo '=== BLOCK ==='
          sed -n '1,520p' CageTrapProjectV4/src/main/java/com/jeancedraz/cagetrap/CageTrapBlock.java
          echo '=== MAIN ==='
          sed -n '1,420p' CageTrapProjectV4/src/main/java/com/jeancedraz/cagetrap/CageTrap.java
          echo '=== BLOCK ENTITY ==='
          sed -n '1,620p' CageTrapProjectV4/src/main/java/com/jeancedraz/cagetrap/CageTrapBlockEntity.java
          echo '=== CLIENT ==='
          for f in CageTrapProjectV4/src/main/java/com/jeancedraz/cagetrap/client/*.java; do echo "=== $f ==="; sed -n '1,520p' "$f"; done
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Create Minecraft artifacts
        working-directory: CageTrapProjectV4
        run: gradle createMinecraftArtifacts --no-daemon
      - name: Probe item rendering/components APIs
        shell: bash
        run: |
          JAR=''
          while IFS= read -r f; do
            if jar tf "$f" 2>/dev/null | grep -q '^net/minecraft/world/item/ItemStack.class$'; then JAR="$f"; break; fi
          done < <(find CageTrapProjectV4/build ~/.gradle/caches -type f -name '*.jar' 2>/dev/null)
          echo "MINECRAFT_JAR=$JAR"
          test -n "$JAR"
          echo '=== Item ==='
          javap -classpath "$JAR" net.minecraft.world.item.Item | grep -E 'getMaxStackSize|appendHoverText|initializeClient|Properties|render' || true
          echo '=== ItemStack stack/components ==='
          javap -classpath "$JAR" net.minecraft.world.item.ItemStack | grep -E 'getMaxStackSize|isStackable|set\(|remove\(|get\(|has\(' || true
          echo '=== DataComponents ==='
          javap -classpath "$JAR" net.minecraft.core.component.DataComponents | grep -E 'MAX_STACK|CUSTOM|ENTITY|BLOCK_ENTITY|MODEL' || true
          echo '=== IClientItemExtensions ==='
          javap -classpath "$JAR" net.neoforged.neoforge.client.extensions.common.IClientItemExtensions | head -180 || true
          echo '=== item renderer classes ==='
          jar tf "$JAR" | grep -E 'Item.*Render|ItemStack.*Render|Special.*Renderer|Special.*Model' | head -100 || true
