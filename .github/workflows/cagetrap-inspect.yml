name: Inspect Cage Trap Source
on:
  push:
    branches: [ 'agent/cagetrap-v1' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and print CageTrapItem
        shell: bash
        run: |
          base64 -d cagetrap-src-v4.b64 > cagetrap-src-v4.tar.xz
          tar -xJf cagetrap-src-v4.tar.xz
          sed -n '1,360p' CageTrapProjectV4/src/main/java/com/jeancedraz/cagetrap/CageTrapItem.java
