name: Inspect Quantum Hologram APIs
on:
  push:
    branches: [ 'agent/rftoolsbuilder-port-26.1.2' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          base64 -d rftoolsbuilder-port261-src.b64 > rftoolsbuilder-port261-src.tar.xz
          tar -xJf rftoolsbuilder-port261-src.tar.xz
          python3 - <<'PY'
          from pathlib import Path
          p=Path('RFToolsBuilderPort261/src/main/java/mcjty/rftoolsbuilder/client/BuilderScreen.java')
          s=p.read_text()
          s=s.replace('import net.minecraft.client.gui.GuiGraphicsExtractor;\n', 'import net.minecraft.client.Minecraft;\nimport net.minecraft.client.gui.GuiGraphicsExtractor;\n')
          s=s.replace('import net.minecraft.client.gui.screens.Screen;\n', '')
          s=s.replace('        super(menu, inventory, title);\n        this.imageWidth = 176;\n        this.imageHeight = 218;\n', '        super(menu, inventory, title, 176, 218);\n')
          s=s.replace('        boolean fast = Screen.hasShiftDown();', '        boolean fast = Minecraft.getInstance().hasShiftDown();')
          s=s.replace('    protected void extractBackground(GuiGraphicsExtractor graphics, int mouseX, int mouseY, float partialTick) {', '    public void extractBackground(GuiGraphicsExtractor graphics, int mouseX, int mouseY, float partialTick) {')
          p.write_text(s)
          p=Path('RFToolsBuilderPort261/src/main/java/mcjty/rftoolsbuilder/RFToolsBuilder.java')
          p.write_text(p.read_text().replace('Capabilities.EnergyStorage.BLOCK', 'Capabilities.Energy.BLOCK'))
          PY
          python3 rftoolsbuilder-ui-v2.py
          python3 rftoolsbuilder-energy-fix.py
          python3 quantum-filter-core.py
          python3 quantum-filter-client.py
          python3 quantum-api-fix.py
          python3 quantumtools-assets.py
          python3 quantum-ui-polish.py
          python3 quantumtools-3.0.1-fix.py
          echo '=== BUILDER BLOCK ==='
          sed -n '1,360p' RFToolsBuilderPort261/src/main/java/mcjty/rftoolsbuilder/BuilderBlock.java
          echo '=== BUILDER BE ==='
          sed -n '1,520p' RFToolsBuilderPort261/src/main/java/mcjty/rftoolsbuilder/BuilderBlockEntity.java
          echo '=== CLIENT REG ==='
          sed -n '1,320p' RFToolsBuilderPort261/src/main/java/mcjty/rftoolsbuilder/client/RFToolsBuilderClient.java
          echo '=== BLOCKSTATE ==='
          find RFToolsBuilderPort261/src/main/resources/assets/rftoolsbuilder -maxdepth 4 -type f | sort | grep -E 'builder|blockstates' | while read f; do echo ===$f===; cat "$f"; done
