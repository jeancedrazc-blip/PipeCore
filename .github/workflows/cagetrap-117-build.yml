name: Build Cage Trap 1.1.8

on:
  push:
    branches: [ 'agent/cagetrap-v1' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: bash
        run: |
          base64 -d cagetrap-src-v4.b64 > cagetrap-src-v4.tar.xz
          tar -xJf cagetrap-src-v4.tar.xz
      - name: Apply Cage Trap 1.1.8
        run: |
          python3 cagetrap-basepatch.py
          python3 cagetrap-115.py
          python3 cagetrap-116.py
          python3 cagetrap-117.py
          python3 cagetrap-118.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Validate 1.1.8 architecture
        working-directory: CageTrapProjectV4
        run: |
          python3 - <<'PY'
          import pathlib, json
          root=pathlib.Path('src/main/resources')
          for p in root.rglob('*.json'): json.loads(p.read_text(encoding='utf-8'))
          for p in root.rglob('*.png'):
              b=p.read_bytes(); assert b[:8]==b'\x89PNG\r\n\x1a\n', p
          src=pathlib.Path('src/main/java/com/jeancedraz/cagetrap')
          main=(src/'CageTrap.java').read_text()
          item=(src/'CageTrapItem.java').read_text()
          client=(src/'client/CageTrapClient.java').read_text()
          deco=(src/'client/CageTrapItemDecorator.java').read_text()
          be=(src/'CageTrapBlockEntity.java').read_text()
          assert 'properties.stacksTo(64)' in main
          assert 'DataComponents.MAX_STACK_SIZE, 1' in item
          assert 'modBus.addListener(CageTrapClient::registerItemDecorations)' in client
          assert 'modBus.addListener(CageTrapClient::registerRenderers)' in client
          assert 'renderEntityInInventoryFollowsAngle' in deco
          assert 'int x0 = xOffset + 9' in deco and 'int y1 = yOffset + 7' in deco
          assert 'return true;' in deco
          assert 'worldPosition.getY() + 0.125D' in be
          assert "version = '1.1.8'" in pathlib.Path('build.gradle').read_text()
          print('Cage Trap 1.1.8 architecture OK')
          PY
      - name: Compile and build
        working-directory: CageTrapProjectV4
        run: gradle clean build --no-daemon --stacktrace
      - name: Server smoke test
        working-directory: CageTrapProjectV4
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout 90s gradle runServer --no-daemon --stacktrace > server-smoke.log 2>&1
          code=$?
          set -e
          cat server-smoke.log
          if grep -Eqi 'ModLoadingException|Failed to load mod|Exception in thread "main"|Crash report' server-smoke.log; then exit 1; fi
          if ! grep -Eq 'Done \(' server-smoke.log; then echo "Server did not reach ready state (exit code: $code)"; exit 1; fi
      - name: Stage and inspect JAR
        shell: bash
        run: |
          cp CageTrapProjectV4/build/libs/cagetrap-1.1.8.jar CageTrap-1.1.8-NeoForge-26.1.2.jar
          unzip -t CageTrap-1.1.8-NeoForge-26.1.2.jar
          jar tf CageTrap-1.1.8-NeoForge-26.1.2.jar | grep -q 'com/jeancedraz/cagetrap/client/CageTrapItemDecorator.class'
          sha256sum CageTrap-1.1.8-NeoForge-26.1.2.jar
      - uses: actions/upload-artifact@v4
        with:
          name: CageTrap-1.1.8-NeoForge-26.1.2
          path: CageTrap-1.1.8-NeoForge-26.1.2.jar