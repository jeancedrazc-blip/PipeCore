name: Inspect Pipe Models

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-models.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and patch source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          parts = sorted(Path('build-src').glob('part_*.b64'))
          Path('pipecore-src.tar.xz').write_bytes(base64.b64decode(b''.join(p.read_bytes() for p in parts), validate=False))
          PY
          tar -xJf pipecore-src.tar.xz
          base64 -d ci/v7_patch.py.gz.b64 | gzip -dc > /tmp/v7_patch.py
          python3 /tmp/v7_patch.py PipeCore-v7-buildsrc
          python3 ci/v8_hotfix.py PipeCore-v7-buildsrc
          python3 ci/v9_hotfix.py PipeCore-v7-buildsrc
          python3 ci/v10_hotfix.py PipeCore-v7-buildsrc
      - name: Print pipe model configuration
        shell: bash
        run: |
          cd PipeCore-v7-buildsrc/src/main/resources/assets/pipecore
          echo '===== BLOCKSTATES ====='
          for f in blockstates/item_pipe.json blockstates/fluid_pipe.json blockstates/energy_pipe.json blockstates/chemical_pipe.json; do echo "===== $f ====="; cat "$f"; done
          echo '===== MODELS ====='
          find models/block -maxdepth 1 -type f -name '*pipe*.json' -print | sort
          for f in models/block/item_pipe_core.json models/block/item_pipe_arm_up.json models/block/item_pipe_arm_down.json models/block/item_pipe_arm_north.json models/block/item_pipe_arm_south.json models/block/item_pipe_arm_east.json models/block/item_pipe_arm_west.json; do if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi; done
          echo '===== ALL PIPE TEXTURES ====='
          find textures/block -maxdepth 1 -type f -name '*pipe*.png' -print -exec file {} \; -exec sha256sum {} \; | sort
