name: Inspect Pipe Models

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-models.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and patch source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          parts = sorted(Path('build-src').glob('part_*.b64'))
          Path('pipecore-src.tar.xz').write_bytes(base64.b64decode(b''.join(p.read_bytes() for p in parts), validate=False))
          PY
          tar -xJf pipecore-src.tar.xz
          base64 -d ci/v7_patch.py.gz.b64 | gzip -dc > /tmp/v7_patch.py
          python3 /tmp/v7_patch.py PipeCore-v7-buildsrc
          python3 ci/v8_hotfix.py PipeCore-v7-buildsrc
          python3 ci/v9_hotfix.py PipeCore-v7-buildsrc
          python3 ci/v10_hotfix.py PipeCore-v7-buildsrc
      - name: Print output texture configuration
        shell: bash
        run: |
          cd PipeCore-v7-buildsrc
          for f in src/main/resources/assets/pipecore/models/block/pipe_output_base.json src/main/resources/assets/pipecore/models/block/pipe_output_indicator_base.json src/main/resources/assets/pipecore/models/block/item_pipe_output.json src/main/resources/assets/pipecore/models/block/item_pipe_output_indicator.json; do echo "===== $f ====="; cat "$f"; done
          echo '===== renderer references ====='
          grep -n -E 'output|OUTPUT|model|texture' src/main/java/com/pipecore/client/render/PipeBlockEntityRenderer.java || true
